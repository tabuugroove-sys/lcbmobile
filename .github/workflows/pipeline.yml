name: Autopost pipeline

on:
  schedule:
    # 3 posts/day distributed across Brazilian audience peak hours (BRT = UTC-3):
    #   - 08:13 BRT (11:13 UTC) — morning scroll, pre-work
    #   - 13:13 BRT (16:13 UTC) — lunch break peak
    #   - 20:13 BRT (23:13 UTC) — evening prime time (primary engagement)
    #
    # Each slot fires THREE TIMES (20 min apart at :13/:33/:53) for resilience
    # against GHA dropping scheduled runs. Pipeline checks
    # Store.hours_since_last_post() and 2nd/3rd attempts no-op once the slot
    # already produced a post. Net: 3 posts/day, ~9 chances to fire.
    #
    # Off-peak minutes (:13/:33/:53) avoid the GHA load spike at the top of
    # every hour, which is a documented cause of dropped schedule events.
    - cron: "13,33,53 11,16,23 * * *"
    # Daily catch-up at 13:13 UTC (10:13 BRT — between morning and lunch slots).
    # Publishes ONE post only if nothing has been posted in the last 10h —
    # last-line defense against a full slot silently failing.
    - cron: "13 13 * * *"
    # Backup slots 15 minutes after each primary slot. These only run when
    # today's YouTube post count is still behind the expected 1/2/3 cadence.
    - cron: "28 11,16,23 * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated platforms (youtube,telegram,instagram,tiktok,twitter). Empty = YouTube + Instagram."
        required: false
        default: "youtube,instagram"
      dry_run:
        description: "Render only, do not publish"
        required: false
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      limit:
        description: "Max items per run"
        required: false
        default: "1"

concurrency:
  group: autopost
  cancel-in-progress: false

permissions:
  contents: write  # needed so the webhook publisher can create a GitHub Release

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg + fonts + ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core imagemagick
          sudo sed -i 's|<policy domain="path" rights="none" pattern="@\*"/>||' /etc/ImageMagick-6/policy.xml || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore state DB
        uses: actions/cache@v4
        with:
          path: data
          key: lcb-state-${{ github.run_id }}
          restore-keys: |
            lcb-state-

      - name: Decide whether this run should publish
        id: gate
        env:
          TIMEZONE: America/Sao_Paulo
        run: |
          python3 - <<'PY'
          import os
          import sqlite3
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          event = os.environ["GITHUB_EVENT_NAME"]
          schedule = os.environ.get("GITHUB_EVENT_SCHEDULE", "")
          should_run = "true"
          reason = "primary schedule or manual trigger"

          if event == "schedule" and schedule == "28 11,16,23 * * *":
              target_by_hour = {11: 1, 16: 2, 23: 3}
              now_utc = datetime.now(tz=ZoneInfo("UTC"))
              target = target_by_hour.get(now_utc.hour, 0)
              tz = ZoneInfo(os.environ.get("TIMEZONE", "America/Sao_Paulo"))
              today_local = now_utc.astimezone(tz).date()
              db_path = Path("data/state.db")
              youtube_posts = 0

              if db_path.exists():
                  conn = sqlite3.connect(db_path)
                  rows = conn.execute(
                      """
                      SELECT fingerprint, posted_at
                      FROM publications
                      WHERE platform = 'youtube' AND status = 'ok'
                      """
                  ).fetchall()
                  conn.close()

                  seen = set()
                  for fingerprint, posted_at in rows:
                      if not posted_at:
                          continue
                      dt = datetime.fromisoformat(posted_at)
                      dt = dt.replace(tzinfo=ZoneInfo("UTC")).astimezone(tz)
                      if dt.date() == today_local:
                          seen.add(fingerprint)
                  youtube_posts = len(seen)

              if youtube_posts >= target:
                  should_run = "false"
                  reason = (
                      f"backup slot skipped: youtube_posts_today={youtube_posts} "
                      f"target={target}"
                  )
              else:
                  reason = (
                      f"backup slot needed: youtube_posts_today={youtube_posts} "
                      f"target={target}"
                  )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"should_run={should_run}\n")
              fh.write(f"reason={reason}\n")
          print(reason)
          PY

      - name: Materialize secret files
        if: steps.gate.outputs.should_run == 'true'
        run: |
          mkdir -p secrets
          if [ -n "${YOUTUBE_CLIENT_SECRET}" ]; then
            echo "$YOUTUBE_CLIENT_SECRET" > client_secret.json
          fi
          if [ -n "${YOUTUBE_TOKEN}" ]; then
            echo "$YOUTUBE_TOKEN" > youtube_token.json
          fi
        env:
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}

      - name: Run pipeline
        if: steps.gate.outputs.should_run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}
          # Free-tier fallback when Anthropic returns credit/auth errors.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          # Learns which RSS candidates tend to win on YouTube.
          ANALYTICS_ENABLED: ${{ vars.ANALYTICS_ENABLED || 'true' }}
          ANALYTICS_CANDIDATE_POOL: ${{ vars.ANALYTICS_CANDIDATE_POOL || '40' }}
          ANALYTICS_HISTORY_LIMIT: ${{ vars.ANALYTICS_HISTORY_LIMIT || '250' }}
          YOUTUBE_METRICS_REFRESH_HOURS: ${{ vars.YOUTUBE_METRICS_REFRESH_HOURS || '6' }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Editorial: how many hours of virtual freshness to give DJ-category
          # items so they compete with high-volume celeb feeds (default 12).
          DJ_CATEGORY_BOOST_HOURS: ${{ vars.DJ_CATEGORY_BOOST_HOURS || '12' }}
          # Anti-duplicate guard: if a successful post happened within this
          # window, the run no-ops. Default 3.5h covers redundant slot triggers
          # (:13/:33/:53). For the daily catch-up cron at 13:13 UTC we override
          # to 10h — it should publish ONLY when the morning slot (11:13 UTC)
          # silently failed (then ~17h since previous night's evening post).
          MIN_HOURS_BETWEEN_POSTS: ${{ github.event.schedule == '13 13 * * *' && '10' || vars.MIN_HOURS_BETWEEN_POSTS || '3.5' }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'LCB Mobile' }}
          CONTENT_LANG: pt-BR
          DB_PATH: data/state.db
          OUTPUT_DIR: out
          BACKGROUND_MUSIC_PATH: ${{ vars.BACKGROUND_MUSIC_PATH || 'assets/audio/primeira_for_youtube.wav' }}
          BACKGROUND_MUSIC_VOLUME: ${{ vars.BACKGROUND_MUSIC_VOLUME || '0.15' }}
          MAX_ITEMS_PER_RUN: ${{ inputs.limit || '1' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          OPTIONAL_PUBLISHERS: ${{ vars.OPTIONAL_PUBLISHERS || 'telegram,instagram' }}

          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_PUBLIC_BASE_URL: ${{ vars.INSTAGRAM_PUBLIC_BASE_URL }}

          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_OPEN_ID: ${{ secrets.TIKTOK_OPEN_ID }}

          TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
          TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}

          TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'elevenlabs' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID || '21m00Tcm4TlvDq8ikWAM' }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL || 'eleven_multilingual_v2' }}
          ELEVENLABS_STABILITY: ${{ vars.ELEVENLABS_STABILITY || '0.62' }}
          ELEVENLABS_SIMILARITY: ${{ vars.ELEVENLABS_SIMILARITY || '0.78' }}
          ELEVENLABS_STYLE: ${{ vars.ELEVENLABS_STYLE || '0.18' }}
          ELEVENLABS_SPEED: ${{ vars.ELEVENLABS_SPEED || '0.82' }}

          # Webhook -> Make.com/Zapier -> YouTube/IG/TikTok
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_AUTH_HEADER: ${{ secrets.WEBHOOK_AUTH_HEADER }}
          WEBHOOK_TARGETS: ${{ vars.WEBHOOK_TARGETS || 'youtube,instagram,tiktok' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          PLATFORMS: ${{ inputs.platforms || vars.PLATFORMS || 'youtube,instagram' }}
        run: |
          ARGS="-v"
          if [ -n "${PLATFORMS}" ]; then
            for p in $(echo "${PLATFORMS}" | tr ',' ' '); do
              ARGS="$ARGS --only $p"
            done
          fi
          python -m scripts.run_pipeline $ARGS

      - name: Reply to YouTube comments
        if: steps.gate.outputs.should_run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}
          DB_PATH: data/state.db
        run: |
          python -m scripts.respond_youtube_comments \
            --video-limit "${{ vars.YOUTUBE_COMMENT_VIDEO_LIMIT || '20' }}" \
            --comment-limit "${{ vars.YOUTUBE_COMMENT_SCAN_LIMIT || '50' }}" \
            --reply-limit "${{ vars.YOUTUBE_COMMENT_REPLY_LIMIT || '10' }}" \
            -v

      - name: Skip summary
        if: steps.gate.outputs.should_run != 'true'
        run: echo "${{ steps.gate.outputs.reason }}"

      - name: Upload generated assets
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lcb-out-${{ github.run_id }}
          path: out
          if-no-files-found: ignore
          retention-days: 7
