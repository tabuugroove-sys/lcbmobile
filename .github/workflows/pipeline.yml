name: Autopost pipeline

on:
  schedule:
    # Temporary cloud primary while the Windows runtime cannot be updated.
    # BRT: 08:45, 13:45, 18:45. This head start lets the rich-media build land
    # before the stale Windows slots at 09:13/14:13/19:13; their live quota
    # gate then prevents a duplicate classic render.
    - cron: "45 11 * * *"
    - cron: "45 16 * * *"
    - cron: "45 21 * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated platforms (youtube,telegram,instagram,tiktok,twitter). Empty = YouTube + Instagram."
        required: false
        default: "youtube,instagram"
      dry_run:
        description: "Render only, do not publish"
        required: false
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      limit:
        description: "Max items per run"
        required: false
        default: "1"
      fallback_mode:
        description: "Exercise the scheduled cloud-fallback path manually"
        required: false
        type: choice
        default: "false"
        options:
          - "false"
          - "true"

concurrency:
  group: autopost
  cancel-in-progress: false

permissions:
  contents: write  # needed so the webhook publisher can create a GitHub Release

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg + fonts + ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core imagemagick
          sudo sed -i 's|<policy domain="path" rights="none" pattern="@\*"/>||' /etc/ImageMagick-6/policy.xml || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore state DB
        uses: actions/cache@v4
        with:
          path: data
          key: lcb-state-${{ github.run_id }}
          restore-keys: |
            lcb-state-

      - name: Materialize secret files
        run: |
          mkdir -p secrets
          if [ -n "${YOUTUBE_CLIENT_SECRET}" ]; then
            echo "$YOUTUBE_CLIENT_SECRET" > client_secret.json
          fi
          if [ -n "${YOUTUBE_TOKEN}" ]; then
            echo "$YOUTUBE_TOKEN" > youtube_token.json
          fi
        env:
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}

      - name: Check live YouTube quota
        id: gate
        env:
          TIMEZONE: America/Sao_Paulo
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule || (inputs.fallback_mode == 'true' && '45 11 * * *') || '' }}
        run: |
          python -m scripts.github_fallback_gate \
            --mode gate \
            --schedule "${GITHUB_EVENT_SCHEDULE}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Run pipeline
        if: steps.gate.outputs.should_run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}
          # Free-tier fallback when Anthropic returns credit/auth errors.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          # Learns which RSS candidates tend to win on YouTube.
          ANALYTICS_ENABLED: ${{ vars.ANALYTICS_ENABLED || 'true' }}
          ANALYTICS_CANDIDATE_POOL: ${{ vars.ANALYTICS_CANDIDATE_POOL || '40' }}
          ANALYTICS_HISTORY_LIMIT: ${{ vars.ANALYTICS_HISTORY_LIMIT || '250' }}
          DRAMA_SIGNAL_WEIGHT: ${{ vars.DRAMA_SIGNAL_WEIGHT || '1.8' }}
          # Prefer another eligible story when the current one has no photo.
          # The pipeline's classic fallback still posts if the whole pool is dry.
          REQUIRE_VISUAL_MEDIA: 'true'
          MIN_VISUAL_MEDIA_ASSETS: '1'
          ALLOW_SOURCE_ARTICLE_IMAGE: 'true'
          REQUIRE_VIDEO_MEDIA: 'false'
          MIN_VIDEO_MEDIA_ASSETS: '0'
          YOUTUBE_METRICS_REFRESH_HOURS: ${{ vars.YOUTUBE_METRICS_REFRESH_HOURS || '6' }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Editorial: how many hours of virtual freshness to give DJ-category
          # items so they compete with high-volume celeb feeds (default 12).
          DJ_CATEGORY_BOOST_HOURS: ${{ vars.DJ_CATEGORY_BOOST_HOURS || '12' }}
          # Scheduled failover is governed by the live daily quota above, so a
          # recent post must not hide a still-missing second or third Short.
          MIN_HOURS_BETWEEN_POSTS: ${{ (github.event_name == 'schedule' || inputs.fallback_mode == 'true' || inputs.dry_run == 'true') && '0' || vars.MIN_HOURS_BETWEEN_POSTS || '3.5' }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'LCB Mobile' }}
          CONTENT_LANG: pt-BR
          DB_PATH: data/state.db
          OUTPUT_DIR: out
          BACKGROUND_MUSIC_PATH: ${{ vars.BACKGROUND_MUSIC_PATH || 'assets/audio/primeira_for_youtube.wav' }}
          BACKGROUND_MUSIC_VOLUME: ${{ vars.BACKGROUND_MUSIC_VOLUME || '0.25' }}
          MAX_ITEMS_PER_RUN: ${{ inputs.limit || '1' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          OPTIONAL_PUBLISHERS: ${{ vars.OPTIONAL_PUBLISHERS || 'telegram,instagram' }}

          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_PUBLIC_BASE_URL: ${{ vars.INSTAGRAM_PUBLIC_BASE_URL }}

          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_OPEN_ID: ${{ secrets.TIKTOK_OPEN_ID }}

          TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
          TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}

          TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'elevenlabs' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID || '21m00Tcm4TlvDq8ikWAM' }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL || 'eleven_multilingual_v2' }}
          ELEVENLABS_STABILITY: ${{ vars.ELEVENLABS_STABILITY || '0.62' }}
          ELEVENLABS_SIMILARITY: ${{ vars.ELEVENLABS_SIMILARITY || '0.78' }}
          ELEVENLABS_STYLE: ${{ vars.ELEVENLABS_STYLE || '0.18' }}
          ELEVENLABS_SPEED: ${{ vars.ELEVENLABS_SPEED || '0.82' }}

          # Webhook -> Make.com/Zapier -> YouTube/IG/TikTok
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_AUTH_HEADER: ${{ secrets.WEBHOOK_AUTH_HEADER }}
          WEBHOOK_TARGETS: ${{ vars.WEBHOOK_TARGETS || 'youtube,instagram,tiktok' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          PLATFORMS: ${{ (github.event_name == 'schedule' || inputs.fallback_mode == 'true') && 'youtube' || inputs.platforms || vars.PLATFORMS || 'youtube,instagram' }}
        run: |
          ARGS="-v"
          if [ -n "${PLATFORMS}" ]; then
            for p in $(echo "${PLATFORMS}" | tr ',' ' '); do
              ARGS="$ARGS --only $p"
            done
          fi
          python -m scripts.run_pipeline $ARGS

      - name: Verify scheduled YouTube quota
        if: steps.gate.outputs.should_run == 'true' && github.event_name == 'schedule'
        env:
          TIMEZONE: America/Sao_Paulo
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python -m scripts.github_fallback_gate \
            --mode verify \
            --schedule "${GITHUB_EVENT_SCHEDULE}" \
            --attempts 12 \
            --delay-seconds 10

      - name: Reply to YouTube comments
        if: steps.gate.outputs.should_run == 'true' && (github.event_name == 'schedule' || inputs.dry_run != 'true')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}
          DB_PATH: data/state.db
        run: |
          python -m scripts.respond_youtube_comments \
            --video-limit "${{ vars.YOUTUBE_COMMENT_VIDEO_LIMIT || '20' }}" \
            --comment-limit "${{ vars.YOUTUBE_COMMENT_SCAN_LIMIT || '50' }}" \
            --reply-limit "${{ vars.YOUTUBE_COMMENT_REPLY_LIMIT || '10' }}" \
            -v

      - name: Skip summary
        if: steps.gate.outputs.should_run != 'true'
        run: echo "${{ steps.gate.outputs.reason }}"

      - name: Upload generated assets
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lcb-out-${{ github.run_id }}
          path: out
          if-no-files-found: ignore
          retention-days: 7

      - name: Alert urgent bot when cloud failover fails
        if: failure() && github.event_name == 'schedule'
        env:
          URGENT_BOT_TOKEN: ${{ secrets.LCBAND_URGENT_BOT_TOKEN }}
          URGENT_CHAT_ID: ${{ secrets.LCBAND_URGENT_CHAT_ID }}
          FALLBACK_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "${URGENT_BOT_TOKEN}" ] || [ -z "${URGENT_CHAT_ID}" ]; then
            echo "Urgent bot secrets are not configured"
            exit 0
          fi
          curl --fail --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${URGENT_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${URGENT_CHAT_ID}" \
            --data-urlencode "text=[URGENT] GitHub fallback failed for ${FALLBACK_SCHEDULE}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
